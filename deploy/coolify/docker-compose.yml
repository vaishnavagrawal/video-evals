# vreview on Coolify (Docker Compose build pack).
#
# Coolify setting             value
#   Build pack                Docker Compose
#   Base Directory            /                                    (relative build contexts below start here)
#   Docker Compose Location   /deploy/coolify/docker-compose.yml
#   Domains                   api -> :8000, web -> :3000, minio -> :9000, all https://   (see README.md)
#
# Nothing here publishes a host port: Coolify's proxy (Traefik) routes to the three services that declare a
# SERVICE_FQDN_* variable, everything else stays on the stack's private network.
# Every secret is generated by Coolify (SERVICE_PASSWORD_*, SERVICE_USER_*) or required from its environment (${VAR:?}).
#
# Keys that only Coolify understands (exclude_from_hc) are removed by Coolify before it runs compose.

services:
  postgres:
    build:
      context: ./deploy/coolify
      dockerfile: Dockerfile.postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    expose:
      - "9000"
    environment:
      # Public: browsers PUT upload parts to presigned URLs on this host.
      - SERVICE_FQDN_MINIO_9000
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      # Only the web app's origin may call it from a browser. MinIO already lists ETag among the headers it exposes
      # to CORS callers, which the multipart upload needs to read each part's ETag.
      - MINIO_API_CORS_ALLOW_ORIGIN=${SERVICE_URL_WEB}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    exclude_from_hc: true
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/vreview
        mc anonymous set private local/vreview

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.114.2
    restart: unless-stopped
    expose:
      - "8888"
      - "7077"
    environment:
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/hatchet?sslmode=disable
      - SERVER_MSGQUEUE_KIND=postgres
      # gRPC stays on the private network; tokens embed these addresses.
      - SERVER_GRPC_BROADCAST_ADDRESS=hatchet:7077
      - SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS=hatchet:7077
      - SERVER_GRPC_BIND_ADDRESS=0.0.0.0
      - SERVER_GRPC_PORT=7077
      - SERVER_GRPC_INSECURE=t
      - SERVER_URL=http://hatchet:8888
      - SERVER_AUTH_COOKIE_DOMAIN=hatchet
      - SERVER_AUTH_COOKIE_INSECURE=f
      - SERVER_AUTH_SET_EMAIL_VERIFIED=t
      # Dashboard admin, created on the first boot only (changing these later does not change the account).
      # Hatchet wants 8-64 characters with an upper-case letter, a lower-case letter and a digit; the "Aa1-" prefix
      # guarantees that, whatever Coolify generates.
      - ADMIN_EMAIL=${SERVICE_LOWERCASEUSER_HATCHETADMIN}@vreview.local
      - ADMIN_PASSWORD=Aa1-${SERVICE_PASSWORD_HATCHETADMIN}
    volumes:
      # Signing keys and cookie secrets live here: back it up, and tokens stop working if it is lost.
      - hatchet-config:/config
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7077"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: ["vreview-api"]
    expose:
      - "8000"
    environment:
      - SERVICE_FQDN_API_8000
      - VREVIEW_RUN_MIGRATIONS=1
      # Traefik terminates TLS: honour its X-Forwarded-Proto/For so redirects keep https. Safe because no port is published.
      - FORWARDED_ALLOW_IPS=*
      - VREVIEW_DATABASE_URL=postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/vreview
      - VREVIEW_STORE=r2
      # Server-side S3 calls stay on the private network; presigned URLs handed to browsers use the public MinIO host.
      - VREVIEW_R2_ENDPOINT_URL=http://minio:9000
      - VREVIEW_R2_PUBLIC_ENDPOINT_URL=${SERVICE_URL_MINIO}
      - VREVIEW_R2_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - VREVIEW_R2_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - VREVIEW_R2_BUCKET=vreview
      - VREVIEW_MAX_UPLOAD_BYTES=${VREVIEW_MAX_UPLOAD_BYTES:-2147483648}
      # better-auth (the web service) signs the JWTs; iss and aud are its public base URL (BETTER_AUTH_URL), the
      # JWKS is fetched over the private network.
      - VREVIEW_AUTH_JWKS_URL=http://web:3000/api/auth/jwks
      - VREVIEW_AUTH_ISSUER=${SERVICE_URL_WEB}
      - VREVIEW_AUTH_AUDIENCE=${SERVICE_URL_WEB}
      - VREVIEW_CORS_ORIGINS=${SERVICE_URL_WEB}
      - VREVIEW_PUBLIC_BASE_URL=${SERVICE_URL_API}
      - VREVIEW_WEBHOOK_SECRET=${SERVICE_PASSWORD_64_WEBHOOK}
      - VREVIEW_TRIAGE_LLM_MODELS=${VREVIEW_TRIAGE_LLM_MODELS:-}
      # Empty on the first deploy: create the token once Hatchet is up (README.md), set it, redeploy.
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN:-}
      - HATCHET_CLIENT_HOST_PORT=hatchet:7077
      - HATCHET_CLIENT_TLS_STRATEGY=none
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: ["vreview-worker"]
    # Sized for two concurrent reviews on a shared host (demucs + whisper on CPU).
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 4
    # A review in flight gets this long to finish when the container is stopped or redeployed.
    stop_grace_period: 120s
    environment:
      - VREVIEW_WORKER_SLOTS=2
      - OMP_NUM_THREADS=4
      - VREVIEW_DATABASE_URL=postgresql+psycopg://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/vreview
      - VREVIEW_STORE=r2
      - VREVIEW_R2_ENDPOINT_URL=http://minio:9000
      - VREVIEW_R2_PUBLIC_ENDPOINT_URL=${SERVICE_URL_MINIO}
      - VREVIEW_R2_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - VREVIEW_R2_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - VREVIEW_R2_BUCKET=vreview
      # The worker sends the webhooks and builds their review_url.
      - VREVIEW_PUBLIC_BASE_URL=${SERVICE_URL_API}
      - VREVIEW_WEBHOOK_SECRET=${SERVICE_PASSWORD_64_WEBHOOK}
      - VREVIEW_TRIAGE_LLM_MODELS=${VREVIEW_TRIAGE_LLM_MODELS:-}
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN:-}
      - HATCHET_CLIENT_HOST_PORT=hatchet:7077
      - HATCHET_CLIENT_TLS_STRATEGY=none
      # The SDK serves GET /health on 8001 once the worker is registered; the healthcheck below uses it.
      - HATCHET_CLIENT_WORKER_HEALTHCHECK_ENABLED=true
      # LLM access for the judge, speech and triage text.
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:?}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL:?}
      - DUBEVAL_LLM_API_KEY=${DUBEVAL_LLM_API_KEY:-}
      - DUBEVAL_LLM_BASE_URL=${DUBEVAL_LLM_BASE_URL:-}
      - DUBEVAL_LLM_MODEL=${DUBEVAL_LLM_MODEL:-}
    volumes:
      # HF_HOME, TORCH_HOME, ~/.cache/dubeval and the scratch directory (see Dockerfile). Models download on first use.
      - worker-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      hatchet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  web:
    build:
      context: ./web
      args:
        # Required, and inlined into the browser bundle at build time: it must be the PUBLIC api URL, and changing
        # the API domain means rebuilding this service.
        - NEXT_PUBLIC_VREVIEW_API_URL=${SERVICE_URL_API}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_WEB_3000
      - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_BETTERAUTH}
      - BETTER_AUTH_URL=${SERVICE_URL_WEB}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/vreview_auth
      # ALLOW_SIGNUP is deliberately not set: sign-up stays closed (create users with npm run user:create).
    depends_on:
      postgres:
        condition: service_healthy
    # The image has its own HEALTHCHECK (/api/health) and applies the auth migrations on every start.

volumes:
  postgres-data:
  minio-data:
  hatchet-config:
  worker-data:
