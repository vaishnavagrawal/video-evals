name: vreview

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vreview
      POSTGRES_PASSWORD: vreview
      POSTGRES_DB: vreview
    ports:
      - "55433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vreview -d vreview"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    entrypoint: >
      /bin/bash -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb --ignore-existing local/vreview &&
      /usr/bin/mc anonymous set private local/vreview
      "
    depends_on:
      minio:
        condition: service_healthy

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:v0.114.2
    restart: unless-stopped
    ports:
      - "58888:8888"
      - "57077:7077"
    environment:
      DATABASE_URL: "postgresql://vreview:vreview@postgres:5432/hatchet?sslmode=disable"
      SERVER_MSGQUEUE_KIND: "postgres"
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet:7077"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: "hatchet:7077"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_PORT: "7077"
      SERVER_GRPC_INSECURE: "t"
      SERVER_URL: "http://localhost:58888"
      SERVER_AUTH_COOKIE_DOMAIN: "localhost"
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
    volumes:
      - hatchet_config:/config
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7077"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "58000:8000"
    env_file:
      - path: ../.env
        required: false
    command: ["vreview-api"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      hatchet:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    command: ["vreview-worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      hatchet:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  hatchet_config:
